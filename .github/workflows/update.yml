name: OLE daily statistics
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/update.yml']
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --no-save --ignore-scripts playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - name: Verify public OLE pages in cloud browser
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { appendFileSync } from 'node:fs';
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage({viewport:{width:1440,height:1000},locale:'ru-RU',timezoneId:'Europe/Moscow'});
            page.setDefaultTimeout(45000);
            await page.route('**/*', r => ['image','media','font'].includes(r.request().resourceType()) ? r.abort() : r.continue());
            await page.goto('https://olesports.ru/tournament/69c44c9c58b34123d1da53e6?section=stats');
            await page.locator('.standings.desktop a[href="/club/69eb8fbcb2c23fc612a69398"]').waitFor();
            const report = {};
            report.table = await page.locator('.standings.desktop a[href="/club/69eb8fbcb2c23fc612a69398"]').evaluate(el=>el.closest('.standings-row').innerText);
            for (const label of ['Результаты','Календарь']) {
              await page.getByText(label,{exact:true}).click();
              await page.waitForTimeout(2000);
              report[label] = await page.evaluate(()=>Array.from(document.querySelectorAll('a[href^="/match/"]')).filter(a=>!a.className.includes('carousel') && a.innerText.includes('Транслогистика')).slice(0,3).map(a=>({href:a.getAttribute('href'),row:a.outerHTML,parent:a.parentElement.outerHTML.slice(0,12000)})));
            }
            const json = JSON.stringify(report,null,2);
            console.log(json);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## OLE source verification\n\n```json\n'+json+'\n```\n');
          } finally { await browser.close(); }
          NODE
