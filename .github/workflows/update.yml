name: OLE daily statistics
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    paths: ['.github/workflows/update.yml', '*.mjs']
permissions:
  contents: read
concurrency:
  group: ole-statistics
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test data validation
        run: node --test model.test.mjs atletico-model.test.mjs navigation.test.mjs
      - run: npm install --no-save --ignore-scripts playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - name: Read and validate Translogistika OLE pages
        timeout-minutes: 7
        id: translogistika
        continue-on-error: true
        run: node collect.mjs
      - name: Read and validate Atletico-Dombay Superliga pages
        timeout-minutes: 7
        id: atletico
        continue-on-error: true
        run: node collect-atletico.mjs
      - name: Publish successful data snapshots
        if: always() && (steps.translogistika.outcome == 'success' || steps.atletico.outcome == 'success')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified OLE football statistics'
            git push
          fi
      - name: Report source validation errors
        if: always() && (steps.translogistika.outcome == 'failure' || steps.atletico.outcome == 'failure')
        run: |
          echo "A source check failed. Last successful data remains published; inspect the failed collection step."
          exit 1